<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMS file viewer</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#edf2f7;color:#163650}header{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:white;border-bottom:1px solid #ccd6df;padding:8px}#paging{display:flex;align-items:center;gap:8px}button,a,select{min-width:44px;min-height:44px;border:1px solid #bccbd8;border-radius:8px;background:white;color:#163650;display:inline-flex;align-items:center;justify-content:center;font-size:18px;text-decoration:none}select{font-size:14px}button:disabled{opacity:.4}a[hidden],[hidden]{display:none!important}#display{padding:12px;overflow:auto;text-align:center}canvas,img{display:block;margin:0 auto;background:white;box-shadow:0 2px 12px #16365022}#status{text-align:center;padding:0 12px;line-height:1.5}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #1976d2}
</style></head><body><header><div id="paging"><button id="previous" title="Previous page" aria-label="Previous page">‹</button><span id="page" aria-live="polite">Loading</span><button id="next" title="Next page" aria-label="Next page">›</button><select id="zoom" aria-label="Zoom"><option value="1">Fit width</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></div><a id="download" title="Download file" aria-label="Download file" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5v2M19 9h-4V3H9v6H5l7 7 7-7"/></svg></a></header><p id="status" role="status">Opening file…</p><main id="display"></main><script type="module" src="/nnic/manual-viewer.js"></script></body></html>
